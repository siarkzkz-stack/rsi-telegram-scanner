name: RSI Telegram Scanner

on:
  schedule:
    # Start the workflow before 19:00 to avoid GitHub's busy top-of-hour queue.
    - cron: '45 18 * * 1-5'
      timezone: "Asia/Almaty"
  workflow_dispatch:

concurrency:
  group: rsi-telegram-scanner
  queue: max

permissions:
  contents: read

jobs:
  wait_for_start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait until 19:00 Almaty on scheduled runs
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          target="$(TZ=Asia/Almaty date -d '19:00 today' +%s)"
          now="$(date +%s)"
          if [ "$now" -lt "$target" ]; then
            echo "Waiting until 19:00 Asia/Almaty"
            sleep "$((target - now))"
          else
            echo "Scheduled job started after 19:00; starting scanner immediately"
          fi
          date '+Scanner handoff time (UTC): %Y-%m-%d %H:%M:%S'
          TZ=Asia/Almaty date '+Almaty time: %Y-%m-%d %H:%M:%S'

  scan:
    needs: wait_for_start
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r rsi_alert_scanner/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile rsi_alert_scanner/rsi_scanner.py

      - name: Run continuous RSI scanner
        env:
          RSI_TELEGRAM_BOT_TOKEN: ${{ secrets.RSI_TELEGRAM_BOT_TOKEN }}
          RSI_TELEGRAM_CHAT_ID: ${{ secrets.RSI_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_alert_scanner/rsi_scanner.py
