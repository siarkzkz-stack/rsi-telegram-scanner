name: RSI Telegram Scanner

on:
  schedule:
    # Almaty is UTC+5: start at 19:00 and restart at 01:00 local time.
    # Each process exits cleanly after 5h50m, before GitHub's 6h hard limit.
    - cron: '0 14,20 * * *'
  workflow_dispatch:

concurrency:
  group: rsi-telegram-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r rsi_alert_scanner/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile rsi_alert_scanner/rsi_scanner.py

      - name: Run continuous RSI scanner
        env:
          RSI_TELEGRAM_BOT_TOKEN: ${{ secrets.RSI_TELEGRAM_BOT_TOKEN }}
          RSI_TELEGRAM_CHAT_ID: ${{ secrets.RSI_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          SCANNER_MAX_RUNTIME_MINUTES: '350'
        run: python rsi_alert_scanner/rsi_scanner.py
